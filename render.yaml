services:
  - type: web
    name: scrapling-mcp
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: mcp --http --host 0.0.0.0 --port 8000
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "8000"
      - key: SCRAPLING_MCP_AUTH_TOKEN
        generateValue: true
